<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wagdi's Family Feud — Host Answer Key</title>
<style>
  @page { size: letter; margin: 9mm; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #15151f; margin: 0; font-size: 10px; line-height: 1.25;
  }
  h1 { font-size: 17px; margin: 0; color: #0b1b54; display: inline; }
  .legend { color: #555; font-size: 9px; margin: 2px 0 6px; }
  .legend b { color: #0b1b54; }

  .grid { columns: 2; column-gap: 12px; }
  .round { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 5px; }
  .round h2 {
    font-size: 10.5px; margin: 0 0 2px; padding: 4px 8px;
    background: #0b1b54; color: #fff; border-radius: 5px; line-height: 1.15;
  }
  .round h2 .n { color: #ffcf4d; font-weight: 800; margin-right: 5px; }

  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 1.5px 2px; border-bottom: 1px solid #eaedf6;
  }
  .tile {
    flex: 0 0 auto;
    width: 24px; height: 24px; border-radius: 50%;
    background: #0b1b54; color: #fff; font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .ans { flex: 1 1 auto; font-size: 10.5px; }
  .pts { flex: 0 0 auto; font-weight: 800; color: #0b1b54; font-size: 10.5px; }
</style>
</head>
<body>
<h1>Wagdi's Family Feud — Answer Key</h1>
<p class="legend">
  Find the answer, click the tile with that <b>number</b> (or press the number key — <b>0</b> for tile 10).
  Tiles <b>1–5</b> = left column, <b>6–10</b> = right column. Top answer = most points.
</p>
<div class="grid" id="out"></div>

<script>
const QUESTIONS = [
  { q:"Name something Wagdi is known for",
    answers:[["His intelligence / engineering",35],["Storytelling",24],["Traveling",18],["Sense of humour",14],["Being a great father/grandfather/friend",9]] },
  { q:"Name something people admire about Wagdi",
    answers:[["His career achievements",32],["Kindness/Generosity",25],["Wisdom",18],["Work ethic",15],["Personality",10]] },
  { q:"Name places Wagdi loves to go",
    answers:[["Airport to Travel",30],["Europe/Paris",26],["Costco",20],["Home",14],["Faculty Club",10]] },
  { q:"Name the numerous names given to Wagdi",
    answers:[["Fred",18],["Freddy",15],["Wag",13],["Dad",11],["Habibi",10],
             ["Dr. Habashi",9],["Professor",8],["Geddo",7],["Big Boss",5],["Ya Faroud",4]] },
  { q:"When Wagdi starts talking, he is usually sharing...",
    answers:[["Advice",34],["A joke",25],["A life lesson",18],["\"Back in my day/When I was young…\"",14],["Something scientific",9]] },
  { q:"Name something that never gets old about Wagdi",
    answers:[["His humour",30],["His stories",24],["His Intellect",19],["His love for family",16],["His energy",11]] },
  { q:"Name a gift Wagdi would actually enjoy",
    answers:[["Books",33],["Travel-related gifts",25],["Time with family",18],["A nice meal at a restaurant",14],["Good cigars",10]] },
  { q:"What sports does Wagdi love to watch/play/do",
    answers:[["Soccer",35],["Tennis",24],["Biking",17],["Ping Pong",14],["Walking with Ghada",10]] },
  { q:"Name a word Wagdi uses to describe something that makes him happy",
    answers:[["Unbelievable",30],["Fantastic",24],["Super",20],["Amazing",15],["Phenomenal",11]] },
  { q:"FINAL ROUND: Name something Wagdi may complain about often",
    answers:[["Seating in restaurants",28],["Watered down drinks",22],["Cars parking beside yours in shopping malls",17],
             ["Pool maintenance",14],["The stock market",11],["Trump",8]] }
];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const out = document.getElementById("out");

QUESTIONS.forEach((item, r) => {
  const rows = item.answers.map((a, i) =>
    '<div class="row">'+
      '<div class="tile">'+(i+1)+'</div>'+
      '<div class="ans">'+esc(a[0])+'</div>'+
      '<div class="pts">'+a[1]+'</div>'+
    '</div>').join("");
  const div = document.createElement("div");
  div.className = "round";
  div.innerHTML = '<h2><span class="n">'+(r+1)+'.</span>'+esc(item.q)+'</h2>'+rows;
  out.appendChild(div);
});
</script>
</body>
</html>
