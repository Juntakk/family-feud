/* ============================================================
   WAGDI'S FAMILY FEUD  — single-file game show app
   ============================================================ */
:root{
  --gold:#D4A017;
  --gold-bright:#ffcf3f;
  --board-blue:#0a1a6e;
  --board-blue-2:#13267e;
  --navy:#040726;
  --amber-glow:255,150,30;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Barlow Condensed',sans-serif;
  background:#02030f;
  color:#fff;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}

/* ============================== STAGE ============================== */
/* Clean, moody TV-studio backdrop — all focus on the glowing board. */
#stage{
  position:fixed;
  inset:0;
  width:100vw;height:100vh;
  overflow:hidden;
  background:
    radial-gradient(ellipse 58% 46% at 50% 44%, rgba(72,120,238,.30) 0%, transparent 60%),
    radial-gradient(ellipse 130% 105% at 50% 48%, #0c1452 0%, #070d34 44%, #030616 78%, #010207 100%);
}

/* soft spotlight rays fanning out from behind the board (subtle) */
.rays{
  position:absolute;inset:-30% -20%;
  pointer-events:none;z-index:1;
  background:
    repeating-conic-gradient(from 0deg at 50% 44%,
      rgba(255,165,55,0.055) 0deg 2.5deg, transparent 2.5deg 17deg),
    repeating-conic-gradient(from 9deg at 50% 44%,
      rgba(95,150,255,0.04) 0deg 2deg, transparent 2deg 20deg);
  mask:radial-gradient(ellipse 72% 72% at 50% 44%, #000 6%, transparent 74%);
  -webkit-mask:radial-gradient(ellipse 72% 72% at 50% 44%, #000 6%, transparent 74%);
  animation:rayspin 160s linear infinite;
}
@keyframes rayspin{to{transform:rotate(360deg);}}

/* warm reflective stage floor */
.floor{
  position:absolute;left:50%;bottom:-10%;
  width:140%;height:40%;
  transform:translateX(-50%);
  pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 46% 88% at 50% 0%,
     rgba(255,160,55,0.32) 0%, rgba(185,92,24,0.10) 32%, transparent 64%);
}

/* bokeh / stars (subtle depth) */
.bokeh{position:absolute;border-radius:50%;pointer-events:none;z-index:1;
  animation:twinkle 4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.16;}50%{opacity:.68;}}

/* ============================== OVAL + BOARD ============================== */
.oval-wrap{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(96vw,1400px);height:min(88vh,820px);
  z-index:3;
}
.oval{
  position:absolute;inset:0;border-radius:50%/50%;
  /* layered: amber dot halo + amber dot core + deep-blue base */
  background:
    radial-gradient(circle, rgba(255,178,60,0.50) 2.6px, transparent 4.2px),
    radial-gradient(circle, rgba(255,208,98,0.95) 1.3px, transparent 2.4px),
    radial-gradient(ellipse at 50% 42%, #14246a 0%, #0c1646 52%, #070d30 100%);
  background-size:24px 24px, 24px 24px, 100% 100%;
  border:7px solid #ff9018;
  box-shadow:
    0 0 0 4px #7a3d00,
    0 0 0 9px #ffb347,
    0 0 0 12px #6a3500,
    0 0 60px 12px rgba(255,140,20,.7),
    0 0 120px 30px rgba(255,140,20,.35),
    inset 0 0 0 14px rgba(255,150,30,.15),
    inset 0 0 80px rgba(255,140,20,.2);
}
@keyframes bulbflick{0%,100%{opacity:.55;}50%{opacity:1;}}

/* gold-framed answer board in the centre of the oval */
.board-frame{
  position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);
  width:62%;height:60%;
  background:linear-gradient(180deg,#0c1656,#070e38);
  border:5px solid #e3ad2e;border-radius:16px;
  box-shadow:0 0 0 3px #6a4400, 0 0 38px rgba(255,150,30,.55), inset 0 0 28px #00031f;
  padding:2.4% 3%;z-index:6;
}
/* answer board — 2 columns, rows set dynamically via JS */
.board{
  width:100%;height:100%;
  display:grid;grid-auto-flow:column;
  grid-template-columns:1fr 1fr;
  gap:3% 5%;
}

/* ---- Real Family Feud tile look ---- */
.tile{position:relative;min-height:0;perspective:1200px;cursor:default;}
.board.host-armed .tile:not(.revealed):not(.empty){cursor:pointer;}
.tile-inner{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .6s ease;}
.tile.revealed .tile-inner{transform:rotateY(180deg);}

/* shared face — double-border frame (dark outer, white inner) */
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:7px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  /* dark outer border */
  border:3px solid #1a1a2e;
  /* white inner border via outline */
  outline:2px solid rgba(255,255,255,.75);
  outline-offset:-5px;
}

/* FRONT — bright blue gradient, number inside a dark oval */
.face.front{
  background:linear-gradient(180deg,
    #6a9eea 0%,
    #4878d8 18%,
    #3562cc 40%,
    #2750bb 65%,
    #1e3fa8 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.5);
}
/* oval number badge */
.num-oval {
  width: 18%;
  aspect-ratio: 2.2 / 1;
  background: linear-gradient(180deg, #172060 0%, #0d1545 100%);
  border-radius: 50% / 50%;
  border: 2.5px solid rgba(255, 255, 255, .7);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .15);
  display: flex;
  align-items: center;
  justify-content: center;
}
.num{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,4.2vh,48px);
  color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.8);
  letter-spacing:1px;
}

/* BACK — revealed */
.face.back{
  transform:rotateY(180deg);
  background:linear-gradient(180deg,
    #4878d8 0%,#2750bb 40%,#1a3899 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 3px 8px rgba(0,0,0,.5);
  justify-content:space-between;
  padding:0 5%;
}
.ans-text{font-family:'Bebas Neue',sans-serif;color:#fff;
  font-size:clamp(15px,2.7vh,30px);letter-spacing:.5px;line-height:1;
  flex:1;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.ans-pts{font-family:'Bebas Neue',sans-serif;color:#001034;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  min-width:52px;height:56%;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,3vh,32px);padding:0 9px;
  box-shadow:0 0 8px rgba(var(--amber-glow),.6);}

/* ============================== TITLE BADGE ============================== */
.badge{
  position:absolute;left:50%;top:1.2vh;transform:translateX(-50%);
  z-index:9;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#1c2f74 0%,#0c1648 55%,#070d2c 100%);
  border:5px solid #ff8c1a;border-radius:50%/50%;
  padding:8px 52px;
  box-shadow:0 0 0 3px #7a3d00, 0 0 30px rgba(var(--amber-glow),.7),
             inset 0 4px 20px rgba(120,150,255,.18), inset 0 0 22px #00040f;
}
.badge .w{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,3.5vh,38px);
  color:var(--gold-bright);line-height:.92;
  text-shadow:0 0 4px #000,2px 2px 0 #7a4a00,0 0 18px rgba(var(--amber-glow),.7);
  -webkit-text-stroke:1px #5a3500;}
.badge .ff{font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,3vh,32px);
  color:#fff;line-height:.92;letter-spacing:2px;
  text-shadow:0 0 4px #000,2px 2px 0 #1a3a8a,0 0 16px #4f8bff;
  -webkit-text-stroke:1px #14306e;}

/* ============================== SCORES ============================== */
.score{position:absolute;top:2vh;z-index:9;text-align:center;width:220px;}
.score.left{left:1.5vw;}
.score.right{right:1.5vw;}
.score .name{font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,2.6vh,30px);
  color:var(--gold-bright);text-shadow:0 0 16px rgba(var(--amber-glow),.9);
  letter-spacing:1px;white-space:normal;word-break:break-word;line-height:1.1;}
.score .val{font-family:'Bebas Neue',sans-serif;font-size:clamp(38px,7vh,74px);
  color:var(--gold-bright);line-height:.9;
  text-shadow:0 0 24px rgba(var(--amber-glow),1),0 4px 0 #5a3500;}

/* PUBLIC QUESTION BAR (visible to everyone) + round points tally */
.question-bar{
  position:absolute;left:50%;top:11.5vh;transform:translateX(-50%);
  width:min(52vw,720px);min-height:46px;z-index:8;
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(180deg,var(--board-blue-2),var(--board-blue));
  border:4px solid var(--gold);border-radius:14px;
  box-shadow:0 0 30px rgba(var(--amber-glow),.55),inset 0 0 22px #00031f;
  padding:10px 24px;
}
.question-bar .q{flex:1;font-family:'Bebas Neue',sans-serif;
  font-size:clamp(20px,3.3vh,34px);letter-spacing:1px;line-height:1.05;
  color:#fff;text-shadow:0 0 10px #4f8bff;text-align:center;}
.question-bar .rp{display:flex;flex-direction:column;align-items:center;
  border-left:2px solid #ffffff33;padding-left:18px;min-width:78px;}
.question-bar .rp.rnd{border-left:none;border-right:2px solid #ffffff33;
  padding-left:0;padding-right:18px;}
.rp-l{font-family:'Barlow Condensed';font-size:11px;letter-spacing:2px;
  color:#9fb6ff;text-transform:uppercase;}
.rp-n{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4.6vh,46px);
  color:var(--gold-bright);line-height:.85;
  text-shadow:0 0 16px rgba(var(--amber-glow),.9);}

/* ============================== STRIKES ============================== */
/* invisible clickable zone wrapping the 3 strikes — click anywhere to add a strike */
.strike-zone{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);
  z-index:8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:12px 36px;border-radius:16px;transition:background .2s;}
.strike-zone:hover{background:rgba(255,60,60,0.08);}
.strike-zone:active{background:rgba(255,60,60,0.16);}
.strikes{display:flex;gap:18px;}
.strike-slot{font-family:'Bebas Neue',sans-serif;font-size:46px;
  width:60px;height:60px;display:flex;align-items:center;justify-content:center;
  border:3px solid #2a3360;border-radius:10px;color:#3a4470;background:#070b22;
  transition:.25s;}
.strike-slot.on{color:#ff2b2b;border-color:#ff2b2b;
  text-shadow:0 0 18px #ff2b2b;box-shadow:0 0 22px #ff2b2b88;}

/* giant strike overlay */
#bigStrike{position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;gap:5vh;pointer-events:none;}
#bigStrike.show{display:flex;animation:strikeAnim 1.5s ease-out forwards;}
#bigStrike .x{font-family:'Bebas Neue',sans-serif;color:#ff1a1a;
  line-height:1;text-shadow:0 0 60px #ff0000,0 0 120px #ff0000;}
@keyframes strikeAnim{
  0%{opacity:0;transform:scale(.2);}
  15%{opacity:1;transform:scale(1.15);}
  30%{transform:scale(.95);}
  45%{transform:scale(1.05);}
  60%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.1);}
}
#bigStrike.show::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,#ff000033,transparent 60%);
  animation:redflash 1.5s ease-out forwards;}
@keyframes redflash{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}

/* ============================== HOST PANEL ============================== */
#gear{position:fixed;left:14px;bottom:14px;z-index:120;
  width:46px;height:46px;border-radius:50%;
  background:#000a;border:1px solid #ffffff33;color:#fff;
  font-size:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:.3;transition:opacity .25s,transform .4s;}
#gear:hover{opacity:1;transform:rotate(90deg);}

#hostPanel{position:fixed;top:0;left:0;height:100%;width:380px;z-index:130;
  background:linear-gradient(180deg,#0a1240,#05071e);
  border-right:2px solid var(--gold);
  box-shadow:6px 0 40px #000c;
  transform:translateX(-105%);transition:transform .35s ease;
  display:flex;flex-direction:column;padding:18px;gap:12px;overflow-y:auto;}
#hostPanel.open{transform:translateX(0);}
#hostPanel h2{font-family:'Bebas Neue';color:var(--gold-bright);font-size:28px;
  letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
#hostPanel .close{cursor:pointer;color:#fff;font-size:22px;opacity:.7;}
#hostPanel .round-ind{font-family:'Bebas Neue';font-size:22px;color:#9fb6ff;}
#hostPanel .q-text{background:#0009;border:1px solid #ffffff22;border-radius:8px;
  padding:10px;font-size:18px;color:#fff;font-weight:600;line-height:1.2;}
.host-ans{display:flex;align-items:center;gap:8px;
  background:#ffffff0a;border:1px solid #ffffff14;border-radius:8px;padding:7px 9px;}
.host-ans .txt{flex:1;font-size:16px;font-weight:600;color:#fff;}
.host-ans .pts{color:var(--gold-bright);font-family:'Bebas Neue';font-size:20px;
  min-width:34px;text-align:center;}
.host-ans.done{opacity:.45;}
.host-ans.done .txt{text-decoration:line-through;}
.host-ans button{font-family:'Barlow Condensed';font-weight:700;font-size:13px;
  background:#1c8a3c;color:#fff;border:none;border-radius:6px;padding:6px 10px;
  cursor:pointer;white-space:nowrap;}
.host-ans button:disabled{background:#33415a;cursor:not-allowed;color:#8895b5;}
.host-divider{height:1px;background:#ffffff1a;margin:4px 0;}
.btn{font-family:'Bebas Neue';letter-spacing:1px;border:none;border-radius:8px;
  padding:11px;font-size:18px;cursor:pointer;color:#fff;transition:filter .15s;}
.btn:hover{filter:brightness(1.12);}
.btn.strike{background:linear-gradient(#d11,#900);box-shadow:0 0 16px #ff000066;}
.btn.f1{background:linear-gradient(#1565d8,#0b3e8c);}
.btn.f2{background:linear-gradient(#b4451a,#7a2c0d);}
.btn.next{background:linear-gradient(var(--gold-bright),var(--gold));color:#1a0f00;}
.host-strikes{display:flex;gap:10px;justify-content:center;font-family:'Bebas Neue';
  font-size:30px;}
.host-strikes span{color:#39406a;}
.host-strikes span.on{color:#ff2b2b;text-shadow:0 0 10px #ff2b2b;}
.host-label{font-size:12px;letter-spacing:2px;color:#7e8cc0;text-transform:uppercase;}
.host-hint{font-size:13px;color:#9fb6ff;font-style:italic;line-height:1.3;
  background:#ffffff08;border:1px dashed #ffffff22;border-radius:8px;padding:8px 10px;}

/* ============================== SCREENS ============================== */
.screen{position:fixed;inset:0;z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;}
/* hide the warm floor glow while a screen overlay is showing */
body.screen-open .floor{opacity:0;}
.screen.active{display:flex;}
.start-title{font-family:'Bebas Neue';margin-bottom:30px;}
.start-title .w{font-size:clamp(54px,11vh,120px);color:var(--gold-bright);line-height:.85;
  text-shadow:0 0 30px rgba(var(--amber-glow),.8),3px 3px 0 #5a3500;-webkit-text-stroke:2px #5a3500;}
.start-title .ff{font-size:clamp(40px,8vh,90px);color:#fff;letter-spacing:3px;line-height:.9;
  text-shadow:0 0 26px #4f8bff,3px 3px 0 #14306e;-webkit-text-stroke:1px #14306e;}
.play-btn{font-family:'Bebas Neue';font-size:clamp(30px,5vh,52px);letter-spacing:3px;
  padding:16px 70px;border:none;border-radius:16px;cursor:pointer;color:#1a0f00;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  box-shadow:0 6px 0 #7a5300;
  transition:transform .12s,filter .15s;}
.play-btn:hover{filter:brightness(1.08);}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a5300;}

/* end screen */
#endScreen .winner-label{font-family:'Bebas Neue';font-size:26px;letter-spacing:5px;color:#9fb6ff;}
#endScreen .winner-name{font-family:'Bebas Neue';font-size:clamp(60px,13vh,150px);
  color:var(--gold-bright);line-height:.85;
  text-shadow:0 0 40px rgba(var(--amber-glow),1),4px 4px 0 #5a3500;}
#endScreen .final{display:flex;gap:60px;margin:30px 0;}
#endScreen .final .grp{font-family:'Bebas Neue';}
#endScreen .final .n{font-size:30px;color:#fff;}
#endScreen .final .s{font-size:70px;color:var(--gold-bright);line-height:.85;
  text-shadow:0 0 22px rgba(var(--amber-glow),.9);}

/* confetti */
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:190;
  animation:fall linear forwards;}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0);opacity:1;}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.9;}
}

.hidden-board #gameUI{display:none;}
</style>
</head>
<body class="hidden-board">

<div id="bigStrike"></div>

            for(let i=0;i<d.length;i++){ if(Math.abs(d[i])>thr){ if(i<start) start=i; break; } }
          }
          clip.offset=Math.max(0, start/buf.sampleRate - 0.008); // tiny pre-roll for the attack
        }
        clip.buffer=buf;
      }, ()=>{});
    }catch(e){}
  };
  clip.play=function(vol, synth){
    if(clip.buffer){
      const c=ac(), s=c.createBufferSource(), g=c.createGain();
      s.buffer=clip.buffer; g.gain.value=(vol==null?0.9:vol);
      s.connect(g).connect(c.destination);
      s.start(0, clip.offset);
    } else {
      try{ clip.fallback.currentTime=0; const p=clip.fallback.play(); if(p&&p.catch) p.catch(()=>{}); }
      catch(e){ if(synth) synth(); }   // ultimate fallback to a synth blip
      clip.load();                     // decode so it's instant next time
    }
  };
  return clip;
}
const dingClip   = makeClip(DING_SRC, false);   // correct-answer ding — play as-is
const strikeClip = makeClip(STRIKE_SRC, true);  // buzzer — skip leading silence
function sndCorrect(){ dingClip.play(0.9, ()=>{ tone(523,0,0.12,"sine",0.2); tone(784,0.1,0.22,"sine",0.2); }); }
function sndStrike(){  strikeClip.play(0.9, ()=>tone(220,0,0.5,"sawtooth",0.22,70)); }
function sndFanfare(){ tone(523,0,0.18,"square",0.16); tone(659,0.16,0.18,"square",0.16); tone(880,0.32,0.42,"square",0.18); }

/* ============================================================
   DECORATIVE BUILDERS
   ============================================================ */
function buildDecor(){
  // bokeh / sparkling stars (subtle depth)
  const stage=$("stage");
  for(let i=0;i<90;i++){
    const b=document.createElement("div");b.className="bokeh";
    const s=1.5+Math.random()*5;
    b.style.width=b.style.height=s+"px";
    b.style.left=(Math.random()*100)+"%";
    b.style.top=(Math.random()*100)+"%";
    const warm=Math.random()>0.45;
    const col=warm?"255,200,110":"150,190,255";
    b.style.background="rgba("+col+",1)";
    b.style.boxShadow="0 0 "+(s*2.4)+"px rgba("+col+",.95)";
    b.style.animationDelay=(Math.random()*4)+"s";
    b.style.animationDuration=(2.5+Math.random()*4)+"s";
    stage.appendChild(b);
  }
}

/* ============================================================
   BOARD RENDERING
   ============================================================ */
function buildBoard(){
  const board=$("board");
  board.innerHTML="";
  const ans=cur().answers;
  board.style.gridTemplateRows="repeat(5,1fr)";   // always 5 rows
  for(let i=0;i<10;i++){
    const a=ans[i];
    const tile=document.createElement("div");
    tile.dataset.i=i;
    if(a){
      tile.className="tile";
      tile.innerHTML=
        '<div class="tile-inner">'+
          '<div class="face front"><div class="num-oval"><span class="num">'+(i+1)+'</span></div></div>'+
          '<div class="face back"><span class="ans-text">'+a[0]+'</span><span class="ans-pts">'+a[1]+'</span></div>'+
        '</div>';
      tile.addEventListener("click",()=>revealAnswer(i));
    } else {
      // blank tile — same frame, no number
      tile.className="tile empty";
      tile.innerHTML='<div class="tile-inner"><div class="face front"></div></div>';
    }
    board.appendChild(tile);
  }
  board.classList.toggle("host-armed",state.hostArmed);
}

function revealAnswer(i){
  if(!cur().answers[i]) return;      // only provided answers can be revealed
  if(state.revealed[i]) return;
  state.revealed[i]=true;
  state.roundPoints += cur().answers[i][1];
  const tile=$("board").querySelector('.tile[data-i="'+i+'"]');
  if(tile) tile.classList.add("revealed");
  $("roundTally").textContent=state.roundPoints;
  sndCorrect();
}

/* ============================================================
   STRIKES
   ============================================================ */
function addStrike(){
  state.strikes = (state.strikes + 1) % 4;   // 1 → 2 → 3 → 0 (4th click clears), then repeats
  renderStrikes();
  if(state.strikes === 0) return;             // the refresh click just clears the strikes (silent)
  showBigStrike(state.strikes);
  sndStrike();
}
function showBigStrike(n){
  const bs=$("bigStrike");
  bs.innerHTML="";
  const size = n===1 ? 46 : n===2 ? 34 : 26;   // vh — shrink so they fit in a row
  for(let i=0;i<n;i++){
    const x=document.createElement("div");
    x.className="x";
    x.style.fontSize=size+"vh";
    x.textContent="✗";
    bs.appendChild(x);
  }
  // retrigger animation
  bs.classList.remove("show");void bs.offsetWidth;bs.classList.add("show");
}
function renderStrikes(){
  const slots=$("strikes").children;
  for(let i=0;i<3;i++) slots[i].classList.toggle("on",i<state.strikes);
}

/* ============================================================
   SCORES + AWARD
   ============================================================ */
function renderScores(){
  $("f1Name").textContent=state.f1.name;
  $("f2Name").textContent=state.f2.name;
  $("f1Score").textContent=state.f1.score;
  $("f2Score").textContent=state.f2.score;
}
function award(team){
  if(state.roundPoints<=0) return;
  state[team].score += state.roundPoints;
  renderScores();
  sndFanfare();
  state.roundPoints=0;
  $("roundTally").textContent=0;
  // close panel, then advance to next round after a short pause so the fanfare plays
  $("hostPanel").classList.remove("open");
  setTimeout(()=>nextRound(), 1400);
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function loadRound(){
  state.revealed=cur().answers.map(()=>false);
  state.strikes=0;
  state.roundPoints=0;
  $("roundTally").textContent=0;
  buildBoard();
  renderStrikes();
  renderHost();
}
function nextRound(){
  if(state.round>=QUESTIONS.length-1){ endGame(); return; }
  state.round++;
  loadRound();
}

/* ============================================================
   HOST PANEL
   ============================================================ */
function renderHost(){
  $("roundInd").textContent="Round "+(state.round+1)+" / "+QUESTIONS.length;
  $("roundNum").textContent=state.round+1;
  $("hostQ").textContent=cur().q;
  $("publicQ").textContent=cur().q;
  $("awF1n").textContent=state.f1.name;
  $("awF2n").textContent=state.f2.name;
}

/* ============================================================
   GAME START / END
   ============================================================ */
function startGame(){
  ac().resume&&ac().resume();
  dingClip.load(); strikeClip.load();   // pre-decode clips so the first play is instant
  state.f1.name="THE BOUNDARY LAYERS";
  state.f2.name="THE WIND TUNNELS";
  state.f1.score=0;state.f2.score=0;
  state.round=0;
  renderScores();
  loadRound();
  document.body.classList.remove("hidden-board");
  $("startScreen").classList.remove("active");
  $("endScreen").classList.remove("active");
  document.body.classList.remove("screen-open");
}
function endGame(){
  let winner;
  if(state.f1.score>state.f2.score) winner=state.f1.name;
  else if(state.f2.score>state.f1.score) winner=state.f2.name;
  else winner="IT'S A TIE!";
  $("winnerName").textContent=winner;
  $("endF1n").textContent=state.f1.name;$("endF1s").textContent=state.f1.score;
  $("endF2n").textContent=state.f2.name;$("endF2s").textContent=state.f2.score;
  $("endScreen").classList.add("active");
  document.body.classList.add("screen-open");
  sndFanfare();
  launchConfetti();
}
let confettiTimers=[];
function launchConfetti(){
  confettiTimers.forEach(clearTimeout);confettiTimers=[];
  const colors=["#ffcf3f","#ff6b1a","#4f8bff","#ff2b6b","#3ddc84","#ffffff"];
  for(let i=0;i<140;i++){
    const t=setTimeout(()=>{
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=(Math.random()*100)+"vw";
      c.style.background=colors[(Math.random()*colors.length)|0];
      c.style.animationDuration=(2.5+Math.random()*2.5)+"s";
      c.style.transform="rotate("+(Math.random()*360)+"deg)";
      if(Math.random()>0.5) c.style.borderRadius="50%";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5200);
    }, Math.random()*1800);
    confettiTimers.push(t);
  }
}

/* ============================================================
   WIRE UP EVENTS
   ============================================================ */
buildDecor();
document.body.classList.add("screen-open"); // start screen is open on page load
$("playBtn").addEventListener("click",startGame);
$("againBtn").addEventListener("click",()=>{ document.body.classList.add("hidden-board"); $("startScreen").classList.add("active"); $("endScreen").classList.remove("active"); document.body.classList.add("screen-open"); });

$("gear").addEventListener("click",()=>$("hostPanel").classList.toggle("open"));
$("hostClose").addEventListener("click",()=>$("hostPanel").classList.remove("open"));
$("strikeZone").addEventListener("click",addStrike);   // click the ✗✗✗ under the board to strike
$("awardF1").addEventListener("click",()=>award("f1"));
$("awardF2").addEventListener("click",()=>award("f2"));

// host keyboard shortcuts (numbers reveal, S strike, N next)
document.addEventListener("keydown",e=>{
  if($("startScreen").classList.contains("active")||$("endScreen").classList.contains("active")) return;
  if(e.target.tagName==="INPUT") return;
  if(e.key>="1"&&e.key<="9"){ const i=+e.key-1; if(i<cur().answers.length) revealAnswer(i); }
  else if(e.key==="0"){ if(cur().answers.length>=10) revealAnswer(9); }
  else if(e.key.toLowerCase()==="s") addStrike();
  else if(e.key.toLowerCase()==="n") nextRound();
});

// init host panel content even before play
renderHost();

// verification hook: open with #shot to jump straight into a played board
if(location.hash==="#shot"){
  startGame();
  state.revealed[0]=true; state.roundPoints+=cur().answers[0][1];
  state.revealed[2]=true; state.roundPoints+=cur().answers[2][1];
  $("board").querySelector('.tile[data-i="0"]').classList.add("revealed");
  $("board").querySelector('.tile[data-i="2"]').classList.add("revealed");
  $("roundTally").textContent=state.roundPoints;
  state.strikes=2; renderStrikes();
}
</script>
</body>
</html>
